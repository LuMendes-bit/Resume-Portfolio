<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Currículo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-info">
                <h1 id="nome">Seu Nome</h1>
                <p id="titulo">Desenvolvedor Full Stack</p>
                <p id="contato">
                    Email: seu.email@exemplo.com<br>
                    Telefone: (00) 00000-0000<br>
                    LinkedIn: linkedin.com/in/seuperfil<br>
                    GitHub: github.com/seuperfil
                </p>
            </div>
        </header>

        <section id="sobre">
            <h2>Sobre</h2>
            <p id="descricao">Breve descrição sobre você e seus objetivos profissionais.</p>
        </section>

        <section id="experiencia">
            <h2>Experiência Profissional</h2>
            <div id="experiencias-lista">
                <!-- As experiências serão adicionadas via JavaScript -->
            </div>
        </section>

        <section id="educacao">
            <h2>Educação</h2>
            <div id="educacao-lista">
                <!-- A educação será adicionada via JavaScript -->
            </div>
        </section>

        <section id="habilidades">
            <h2>Habilidades</h2>
            <div id="habilidades-lista">
                <!-- As habilidades serão adicionadas via JavaScript -->
            </div>
        </section>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
