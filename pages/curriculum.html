<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Currículo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/curriculum.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="nav-menu">
            <a href="curriculum.html" class="nav-link">Currículo</a>
            <a href="projetos.html" class="nav-link">Projetos</a>
            <a href="contato.html" class="nav-link">Contato</a>
        </nav>

        <header>
            <div class="profile-info">
                <button id="theme-switch" class="theme-switch">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="profile-photo">
                    <div class="photo-container">
                        <img id="profile-img" src="../assets/perfil-foto.jpg" alt="Foto de perfil">
                        <label for="photo-upload" class="photo-upload-label">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="photo-upload" accept="image/*" style="display: none;">
                    </div>
                </div>
                <h1 id="nome">Seu Nome</h1>
                <p id="titulo">Desenvolvedor Full Stack</p>
                <div id="contato" class="contact-info">
                    <p class="contact-item">
                        <i class="fas fa-envelope contact-icon"></i>
                        <span class="contact-email">seu.email@exemplo.com</span>
                    </p>
                    <p class="contact-item">
                        <i class="fas fa-phone contact-icon"></i>
                        <span class="contact-phone">(00) 00000-0000</span>
                    </p>
                    <p class="contact-item">
                        <i class="fas fa-map-marker-alt contact-icon"></i>
                        <span class="contact-location">Localização</span>
                    </p>
                    <div class="social-buttons">
                        <a id="linkedin-btn" href="#" target="_blank" class="social-btn linkedin-btn">
                            <i class="fab fa-linkedin"></i> LinkedIn
                        </a>
                        <a id="github-btn" href="#" target="_blank" class="social-btn github-btn">
                            <i class="fab fa-github"></i> GitHub
                        </a>
                    </div>
                </div>
                <button id="download-cv" class="download-btn">
                    <i class="fas fa-download"></i> Download CV
                </button>
            </div>
        </header>

        <section id="sobre" class="section-collapsible">
            <h2 class="section-header">Sobre <span class="toggle-icon">+</span></h2>
            <div class="section-content">
                <p id="descricao">Breve descrição sobre você e seus objetivos profissionais.</p>
            </div>
        </section>

        <section id="experiencia" class="section-collapsible">
            <h2 class="section-header">Experiência Profissional <span class="toggle-icon">+</span></h2>
            <div class="section-content">
                <div id="experiencias-lista">
                    <!-- As experiências serão adicionadas via JavaScript -->
                </div>
            </div>
        </section>

        <section id="educacao" class="section-collapsible">
            <h2 class="section-header">Educação <span class="toggle-icon">+</span></h2>
            <div class="section-content">
                <div id="educacao-lista">
                    <!-- A educação será adicionada via JavaScript -->
                </div>
            </div>
        </section>

        <section id="habilidades" class="section-collapsible">
            <h2 class="section-header">Habilidades <span class="toggle-icon">+</span></h2>
            <div class="section-content">
                <div id="habilidades-lista">
                    <!-- As habilidades serão adicionadas via JavaScript -->
                </div>
            </div>
        </section>
    </div>

    <script src="../js/dados.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
