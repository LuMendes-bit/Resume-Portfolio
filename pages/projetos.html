<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Projetos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/projetos.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="nav-menu">
            <a href="curriculum.html" class="nav-link">Currículo</a>
            <a href="projetos.html" class="nav-link">Projetos</a>
            <a href="contato.html" class="nav-link">Contato</a>
        </nav>

        <h1 style="text-align: center; margin-bottom: 2rem;">Meus Projetos</h1>

        <div id="projetos-container">
            <!-- Projetos serão adicionados via JavaScript -->
        </div>
    </div>

    <script src="../js/dados.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const projetos = dadosCurriculo.projetos || [
                {
                    titulo: "Portfolio Pessoal",
                    descricao: "Site portfolio responsivo desenvolvido com HTML, CSS e JavaScript, apresentando meus trabalhos e habilidades.",
                    tecnologias: ["HTML5", "CSS3", "JavaScript"],
                    demo: "https://exemplo.com/portfolio",
                    github: "https://github.com/seuperfil/portfolio"
                },
                {
                    titulo: "Sistema de Gestão",
                    descricao: "Aplicação web para gestão de tarefas e projetos, com autenticação de usuários e dashboard administrativo.",
                    tecnologias: ["React", "Node.js", "MongoDB"],
                    demo: "https://exemplo.com/gestao",
                    github: "https://github.com/seuperfil/gestao"
                }
            ];

            const projetosContainer = document.getElementById('projetos-container');
            
            projetos.forEach(projeto => {
                const projetoElement = document.createElement('div');
                projetoElement.className = 'projeto-card';
                
                const tecnologiasHtml = projeto.tecnologias
                    .map(tech => `<span class="tecnologia">${tech}</span>`)
                    .join('');

                projetoElement.innerHTML = `
                    <h2 class="projeto-titulo">${projeto.titulo}</h2>
                    <p class="projeto-descricao">${projeto.descricao}</p>
                    <div class="tecnologias">
                        ${tecnologiasHtml}
                    </div>
                    <div class="projeto-links">
                        <a href="${projeto.demo}" target="_blank" class="projeto-link">Demo</a>
                        <a href="${projeto.github}" target="_blank" class="projeto-link">GitHub</a>
                    </div>
                `;
                
                projetosContainer.appendChild(projetoElement);
            });
        });
    </script>
</body>
</html>
